name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # Installa Capacitor se non è già nel package.json (Sicurezza)
      - name: Ensure Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      # Inizializza Capacitor se non presente (necessario per la prima build in CI)
      - name: Init Capacitor (if needed)
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init NutriAI com.nutriai.app --web-dir dist
          fi

      - name: Add Android Platform
        run: |
          npx cap add android
          # Sincronizza i file della build web dentro la cartella android
          npx cap sync android

      # --- STEP AGGIUNTO PER FIREBASE ---
      # Crea il file google-services.json dai segreti di GitHub per configurare le notifiche
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json creato con successo."
          else
            echo "Attenzione: Segreto GOOGLE_SERVICES_JSON non trovato."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriAI-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
