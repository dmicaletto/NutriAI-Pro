name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Cambiato in temurin per maggiore stabilità
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      # Installa Capacitor se non è già nel package.json (Sicurezza)
      - name: Ensure Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      # Inizializza Capacitor se non presente
      - name: Init Capacitor (if needed)
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init NutriAI com.nutriai.app --web-dir dist
          fi

      - name: Add Android Platform
        run: |
          # Se la cartella android non esiste, la crea. Altrimenti sincronizza.
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      # --- STEP AGGIUNTO PER FIREBASE ---
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json creato correttamente dal segreto."
          else
            echo "⚠️ ATTENZIONE: Segreto GOOGLE_SERVICES_JSON non trovato!"
            echo "Creazione di un file google-services.json fittizio per permettere la build..."
            echo '{"project_info":{"project_number":"000000000000","project_id":"dummy-project","storage_bucket":"dummy-bucket"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:000000000000","android_client_info":{"package_name":"com.nutriai.app"}},"api_key":[{"current_key":"dummy-key"}]}]}' > android/app/google-services.json
          fi

      # Setup Gradle Action per gestire meglio la cache e i daemon
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Aggiunto --refresh-dependencies per risolvere errori 403/corruzione cache
          ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriAI-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
